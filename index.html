<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AAC 漸凍症輔助溝通系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b1d3a; /* Deep navy blue background */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation; /* Disable double-tap zoom on iPad */
            overflow: hidden;
        }

        /* Hide scrollbars for smooth interface */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Active button feedback animation */
        .btn-press:active {
            transform: scale(0.96);
            transition: transform 0.08s ease-out;
        }

        /* Custom SVG body zone highlight on hover/touch */
        .body-part-path {
            fill: #3b82f6;
            fill-opacity: 0.25;
            stroke: #60a5fa;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .body-part-path:hover, .body-part-path:active {
            fill: #f59e0b;
            fill-opacity: 0.6;
            stroke: #fbbf24;
            stroke-width: 3;
        }

        /* Custom Toast notification animation */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- Top Display & Primary Speech Control Bar -->
    <div class="h-24 bg-slate-900 border-b border-slate-700 flex items-center px-6 gap-4">
        <!-- Sentence Display Box -->
        <div id="sentence-display" class="flex-1 h-16 bg-slate-100 text-slate-900 rounded-2xl px-6 text-3xl font-bold flex items-center overflow-x-auto whitespace-nowrap shadow-inner border-2 border-slate-300">
            <!-- Text dynamically inserted here -->
        </div>
        
        <!-- Speech & Editing Action Buttons -->
        <button id="btn-backspace" title="退格" class="h-16 w-20 bg-amber-500 hover:bg-amber-400 text-white rounded-2xl text-3xl flex justify-center items-center btn-press shadow-lg shadow-amber-950/50">
            ⌫
        </button>
        <button id="btn-clear" title="清空" class="h-16 w-20 bg-rose-600 hover:bg-rose-500 text-white rounded-2xl text-3xl flex justify-center items-center btn-press shadow-lg shadow-rose-950/50">
            🗑️
        </button>
        <button id="btn-play" title="發音朗讀" class="h-16 w-28 bg-emerald-500 hover:bg-emerald-400 text-white rounded-2xl text-4xl flex justify-center items-center btn-press shadow-lg shadow-emerald-950/50 gap-2 font-bold">
            🔊 <span class="text-xl">讀出</span>
        </button>
    </div>

    <!-- Mode Controls & Settings Bar -->
    <div class="h-16 bg-slate-800/90 flex justify-between items-center px-6 border-b border-slate-700">
        <!-- Interaction Mode Toggle -->
        <div class="flex items-center gap-3">
            <span class="text-lg font-medium text-slate-300">模式:</span>
            <button id="btn-mode-toggle" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-lg font-bold btn-press shadow-md transition-colors">
                📝 句子組合模式
            </button>
            <span id="mode-desc" class="text-sm text-slate-400 hidden md:inline">（點擊按鈕累積句子，按 🔊 發音）</span>
        </div>

        <!-- Vocabulary Import Button -->
        <div class="flex items-center gap-3">
            <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-5 py-2 rounded-xl text-lg font-bold cursor-pointer btn-press border border-slate-500 flex items-center gap-2 shadow-md">
                ⚙️ 匯入詞庫 (JSON)
                <input type="file" id="file-import" accept=".json" class="hidden">
            </label>
        </div>
    </div>

    <!-- Main Interactive Area -->
    <div class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <!-- Left Sidebar: Category Tabs -->
        <div id="category-container" class="w-1/4 max-w-[240px] flex flex-col gap-3 overflow-y-auto no-scrollbar pb-8">
            <!-- Categories rendered dynamically by JavaScript -->
        </div>

        <!-- Right Main View: Words Grid / Body Diagram / Symptom Sub-menu -->
        <div id="main-view-container" class="flex-1 relative bg-slate-900/60 rounded-3xl p-4 border border-slate-700/80 overflow-hidden">
            <!-- Dynamically populated: Word Grid, Interactive Body Map, or Symptom Grid -->
        </div>

    </div>

    <!-- UI Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-2xl text-xl font-bold shadow-2xl opacity-0 pointer-events-none z-50 transform translate-y-4">
        <span id="toast-msg">通知</span>
    </div>

    <script>
        // Default Dictionary Data
        const defaultVocabulary = {
            "日常": ["你好", "謝謝", "對不起", "早晨", "早唞", "好", "唔好", "唔該", "不知道", "等等", "請幫忙", "係"],
            "飲食": ["想飲水", "想飲藥", "想食飯", "太熱", "太凍", "想食粥", "想喝湯", "太甜", "太鹹", "飽啦", "未飽", "擦嘴", "拿杯"],
            "感受": ["開心", "傷心", "嬲", "驚", "好悶", "舒服", "辛苦", "擔心", "緊張", "放鬆"],
            "數字": ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "十", "百"],
            "環境": ["開燈", "關燈", "開電視", "關電視", "開冷氣", "關冷氣", "太嘈", "太靜", "開窗", "關窗"],
            "人物": ["老公", "Dewi", "文翔", "文彥", "文彬", "文青", "Tammy", "高翔", "嘉曼", "嘉裕", "婷婷", "司農", "司直", "司南", "司辰", "心心", "仔女", "醫生", "護士", "家人", "朋友"]
        };

        // Specific Symptoms Sub-menu Data (Option B Flow for "身體" category)
        const bodySymptomsData = {
            "頭部": ["按摩", "頭痛", "頭暈", "痕癢", "麻痺", "發熱", "壓迫感", "抽筋", "痛", "神智不清"],
            "頸部": ["按摩", "頸痛", "喉嚨痛", "吞嚥困難", "轉動困難", "僵硬", "抽筋", "痕癢", "痰多", "喘氣"],
            "胸部": ["按摩", "胸悶", "心口痛", "呼吸困難", "心跳快", "咳嗽", "壓迫感", "痛", "喘氣"],
            "腹部": ["按摩", "肚痛", "肚脹", "胃痛", "想嘔", "肚瀉", "抽筋", "便秘", "消化不良"],
            "手部": ["按摩", "手痛", "手軟", "手麻痺", "手抽筋", "手震", "無力", "關節痛", "腫脹"],
            "背部": ["按摩", "背痛", "腰背痛", "背部僵硬", "酸痛", "壓迫感", "痕癢", "冷感", "抽筋"],
            "腰部": ["按摩", "腰痛", "腰酸", "扭傷感", "僵硬", "無力", "麻痺", "抽筋", "刺痛"],
            "腳部": ["按摩", "腳痛", "腳軟", "腳腫", "腳麻痺", "腳抽筋", "無力", "關節痛", "冷冰冰"]
        };

        // Pastel button colors for visual clarity
        const pastelColors = [
            'bg-sky-200 text-sky-950',
            'bg-emerald-200 text-emerald-950',
            'bg-amber-200 text-amber-950',
            'bg-purple-200 text-purple-950',
            'bg-rose-200 text-rose-950',
            'bg-teal-200 text-teal-950',
            'bg-indigo-200 text-indigo-950',
            'bg-fuchsia-200 text-fuchsia-950'
        ];

        // Application State
        let vocabulary = {};
        let usageStats = {};
        let currentCategory = '最常用';
        let currentBodyPart = null; // Used when inside "身體" sub-menu
        let currentPage = 0;
        let isImmediateMode = false; // false = Sentence Builder, true = Immediate Speech
        let currentSentence = [];

        // HTML Markup template for the strict Left Thumb Rest Zone (Cell index 8 in 4x3 grid)
        const THUMB_REST_ZONE_HTML = `
            <div class="w-full h-full border-2 border-dashed border-amber-500/50 bg-amber-950/20 rounded-2xl flex flex-col items-center justify-center text-amber-400 select-none pointer-events-none p-2 text-center shadow-inner">
                <span class="text-3xl mb-1">🖐️</span>
                <span class="text-base font-bold leading-tight">左手大拇指<br>休息區</span>
            </div>
        `;

        function init() {
            // Load vocabulary & usage statistics from LocalStorage
            const savedVocab = localStorage.getItem('aac_vocabulary');
            vocabulary = savedVocab ? JSON.parse(savedVocab) : defaultVocabulary;

            const savedStats = localStorage.getItem('aac_usageStats');
            usageStats = savedStats ? JSON.parse(savedStats) : {};

            // Pre-warm SpeechSynthesis voices
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            bindGlobalEvents();
            renderCategories();
            renderMainView();
        }

        function saveStats() {
            localStorage.setItem('aac_usageStats', JSON.stringify(usageStats));
        }

        function trackUsage(word) {
            if (!word) return;
            usageStats[word] = (usageStats[word] || 0) + 1;
            saveStats();
        }

        function getFrequentWords() {
            return Object.entries(usageStats)
                .sort((a, b) => b[1] - a[1]) // Sort descending by usage count
                .slice(0, 36) // Get top words
                .map(item => item[0]);
        }

        function speakText(text) {
            if (!text || text.trim() === '') return;

            if (!('speechSynthesis' in window)) {
                showToast('您的裝置不支援語音朗讀功能');
                return;
            }

            // Cancel any current playing audio
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK'; // Cantonese locale
            utterance.rate = 0.88;    // Slightly deliberate pace for clear articulation

            // Attempt to select an explicit Cantonese (Hong Kong) voice
            const voices = window.speechSynthesis.getVoices();
            const hkVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.lang.includes('zh-MYS'));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            msg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        function updateSentenceDisplay() {
            const elDisplay = document.getElementById('sentence-display');
            elDisplay.innerText = currentSentence.join(' ');
            // Auto scroll display bar to the right
            elDisplay.scrollLeft = elDisplay.scrollWidth;
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            const allCategories = ['最常用', '身體', ...Object.keys(vocabulary).filter(k => k !== '身體')];

            allCategories.forEach(cat => {
                const isSelected = cat === currentCategory;
                const btn = document.createElement('button');
                
                // Color formatting for category buttons
                let bgStyle = isSelected 
                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50 scale-[1.02]' 
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700';
                
                if (cat === '身體') {
                    bgStyle = isSelected 
                        ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/50 scale-[1.02]' 
                        : 'bg-amber-950/60 text-amber-200 border border-amber-600/40 hover:bg-amber-900/80';
                }

                btn.className = `w-full text-left px-5 py-4 rounded-2xl text-2xl font-bold btn-press transition-all flex items-center justify-between ${bgStyle}`;
                
                let icon = '📁';
                if (cat === '最常用') icon = '⭐';
                if (cat === '身體') icon = '🧍';
                if (cat === '日常') icon = '💬';
                if (cat === '飲食') icon = '🍚';
                if (cat === '感受') icon = '❤️';
                if (cat === '數字') icon = '🔢';
                if (cat === '環境') icon = '🏠';

                btn.innerHTML = `<span>${icon} ${cat}</span>`;
                btn.onclick = () => {
                    currentCategory = cat;
                    currentBodyPart = null; // Reset body part sub-menu state
                    currentPage = 0;
                    renderCategories();
                    renderMainView();
                };
                container.appendChild(btn);
            });
        }

        function renderMainView() {
            const container = document.getElementById('main-view-container');
            container.innerHTML = '';

            if (currentCategory === '身體') {
                if (currentBodyPart) {
                    // Option B Flow: Render specific body part symptom grid
                    renderSymptomGrid(container, currentBodyPart);
                } else {
                    // Render interactive Body Diagram selector
                    renderBodyMap(container);
                }
            } else {
                // Render regular word grid
                renderStandardGrid(container);
            }
        }

        function renderStandardGrid(container) {
            const words = currentCategory === '最常用' 
                ? getFrequentWords() 
                : (vocabulary[currentCategory] || []);

            // 4 columns x 3 rows = 12 cells.
            // Index 8 (Row 3, Col 1) MUST BE THE THUMB REST ZONE.
            // Available word slots per page = 9 slots: [0, 1, 2, 3, 4, 5, 6, 7, 9]
            const availableSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
            const maxWordsPerPage = availableSlots.length; // 9
            
            const totalPages = Math.max(1, Math.ceil(words.length / maxWordsPerPage));
            const startIndex = currentPage * maxWordsPerPage;
            const currentWords = words.slice(startIndex, startIndex + maxWordsPerPage);

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'w-full h-full grid grid-cols-4 grid-rows-3 gap-4';

            const cells = Array.from({ length: 12 }, () => null);

            // 1. Mandatory Thumb Rest Zone at index 8
            cells[8] = THUMB_REST_ZONE_HTML;

            // 2. Populate word cells
            currentWords.forEach((word, i) => {
                const targetSlot = availableSlots[i];
                const colorClass = pastelColors[(startIndex + i) % pastelColors.length];
                cells[targetSlot] = `
                    <button onclick="handleWordClick('${word}')" class="w-full h-full ${colorClass} rounded-2xl text-3xl font-extrabold shadow-md btn-press flex items-center justify-center p-2 text-center leading-snug break-words">
                        ${word}
                    </button>
                `;
            });

            // 3. Navigation Controls at index 10 and 11
            cells[10] = `
                <button onclick="changePage(-1)" class="w-full h-full bg-slate-800 text-slate-200 border border-slate-600 rounded-2xl text-2xl font-bold btn-press shadow-md ${currentPage === 0 ? 'opacity-30 pointer-events-none' : ''}">
                    ◀ 上一頁
                </button>
            `;
            cells[11] = `
                <button onclick="changePage(1)" class="w-full h-full bg-slate-800 text-slate-200 border border-slate-600 rounded-2xl text-2xl font-bold btn-press shadow-md ${currentPage >= totalPages - 1 ? 'opacity-30 pointer-events-none' : ''}">
                    下一頁 ▶
                </button>
            `;

            // Append all 12 cells into the grid
            cells.forEach(cellHtml => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'w-full h-full';
                cellDiv.innerHTML = cellHtml || '<div class="w-full h-full bg-slate-800/20 rounded-2xl border border-slate-800/40"></div>';
                gridWrapper.appendChild(cellDiv);
            });

            container.appendChild(gridWrapper);
        }

        function renderBodyMap(container) {
            // Container for Body Map layout with dual representation: Front & Back Interactive SVGs + Quick Action Buttons
            const mapWrapper = document.createElement('div');
            mapWrapper.className = 'w-full h-full grid grid-cols-4 grid-rows-3 gap-4 relative';

            // Cell math:
            // Cell 8 = MANDATORY THUMB REST ZONE
            // Cells 0,1,2, 4,5,6 = Body Diagram SVG View area
            // Cells 3, 7, 9, 10, 11 = Direct Touch Body Region Selector Buttons

            const bodyPartsList = [
                { name: '頭部', icon: '🗣️' },
                { name: '頸部', icon: '🧣' },
                { name: '胸部', icon: '🫁' },
                { name: '腹部', icon: '🤰' },
                { name: '手部', icon: '✋' },
                { name: '背部', icon: '🦴' },
                { name: '腰部', icon: '🩲' },
                { name: '腳部', icon: '🦶' }
            ];

            const cells = Array.from({ length: 12 }, () => null);

            // 1. Mandatory Thumb Rest Zone at Index 8 (Bottom Left)
            cells[8] = THUMB_REST_ZONE_HTML;

            // 2. SVG Body Diagram Area spanning top-left cells (Indices 0, 1, 4, 5)
            const bodySvgHTML = `
                <div class="w-full h-full bg-slate-950/80 rounded-2xl border border-slate-700/80 p-3 flex flex-col justify-between items-center relative overflow-hidden">
                    <div class="text-amber-300 text-lg font-bold flex items-center gap-2">
                        <span>🧍 請點擊身體部位或右側按鈕</span>
                    </div>
                    
                    <!-- Side-by-Side SVG Figures (Front & Back) -->
                    <div class="flex-1 w-full flex justify-around items-center gap-2 my-1">
                        <!-- Front View SVG -->
                        <div class="h-full flex flex-col items-center">
                            <span class="text-xs text-slate-400 font-bold mb-1">【 正面 】</span>
                            <svg viewBox="0 0 100 200" class="h-full max-h-[220px] w-auto">
                                <!-- Head -->
                                <circle cx="50" cy="25" r="18" class="body-part-path" onclick="selectBodyPart('頭部')"/>
                                <text x="50" y="27" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold" pointer-events="none">頭</text>
                                
                                <!-- Neck -->
                                <rect x="42" y="44" width="16" height="12" rx="3" class="body-part-path" onclick="selectBodyPart('頸部')"/>
                                
                                <!-- Chest -->
                                <rect x="30" y="58" width="40" height="30" rx="5" class="body-part-path" onclick="selectBodyPart('胸部')"/>
                                <text x="50" y="76" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">胸</text>

                                <!-- Abdomen -->
                                <rect x="32" y="90" width="36" height="30" rx="5" class="body-part-path" onclick="selectBodyPart('腹部')"/>
                                <text x="50" y="108" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腹/肚</text>

                                <!-- Arms -->
                                <path d="M 12 60 Q 25 58 28 62 L 25 120 Q 15 120 12 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <path d="M 88 60 Q 75 58 72 62 L 75 120 Q 85 120 88 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <text x="18" y="90" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold" pointer-events="none">手</text>

                                <!-- Legs -->
                                <path d="M 33 122 L 47 122 L 45 190 L 30 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <path d="M 53 122 L 67 122 L 70 190 L 55 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <text x="50" y="160" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腳</text>
                            </svg>
                        </div>

                        <!-- Back View SVG -->
                        <div class="h-full flex flex-col items-center">
                            <span class="text-xs text-slate-400 font-bold mb-1">【 背面 】</span>
                            <svg viewBox="0 0 100 200" class="h-full max-h-[220px] w-auto">
                                <!-- Head Back -->
                                <circle cx="50" cy="25" r="18" class="body-part-path" onclick="selectBodyPart('頭部')"/>
                                
                                <!-- Neck Back -->
                                <rect x="42" y="44" width="16" height="12" rx="3" class="body-part-path" onclick="selectBodyPart('頸部')"/>

                                <!-- Back / Upper Back -->
                                <rect x="30" y="58" width="40" height="35" rx="5" class="body-part-path" onclick="selectBodyPart('背部')"/>
                                <text x="50" y="78" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">背</text>

                                <!-- Waist / Lower Back -->
                                <rect x="32" y="95" width="36" height="25" rx="5" class="body-part-path" onclick="selectBodyPart('腰部')"/>
                                <text x="50" y="112" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腰</text>

                                <!-- Arms Back -->
                                <path d="M 12 60 Q 25 58 28 62 L 25 120 Q 15 120 12 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <path d="M 88 60 Q 75 58 72 62 L 75 120 Q 85 120 88 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>

                                <!-- Legs Back -->
                                <path d="M 33 122 L 47 122 L 45 190 L 30 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <path d="M 53 122 L 67 122 L 70 190 L 55 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;

            // Combine SVG view spanning cols 1-2, rows 1-2 (indices 0, 1, 4, 5 merged container)
            const bodySvgCellWrapper = document.createElement('div');
            bodySvgCellWrapper.className = 'col-span-2 row-span-2 w-full h-full';
            bodySvgCellWrapper.innerHTML = bodySvgHTML;

            // Map remaining slots (2, 3, 6, 7, 9, 10, 11) to clear, high-contrast Body Part Selector Buttons
            const slotAssignments = [2, 3, 6, 7, 9, 10, 11];

            bodyPartsList.forEach((part, idx) => {
                if (idx < slotAssignments.length) {
                    const slotIndex = slotAssignments[idx];
                    cells[slotIndex] = `
                        <button onclick="selectBodyPart('${part.name}')" class="w-full h-full bg-gradient-to-br from-amber-200 to-amber-300 text-amber-950 rounded-2xl text-3xl font-extrabold shadow-lg btn-press flex flex-col items-center justify-center p-2 border border-amber-400">
                            <span class="text-3xl mb-1">${part.icon}</span>
                            <span>${part.name}</span>
                        </button>
                    `;
                }
            });

            // Build full 12-cell grid layout
            // Index 0 gets the 2x2 SVG wrapper
            const finalGrid = document.createElement('div');
            finalGrid.className = 'w-full h-full grid grid-cols-4 grid-rows-3 gap-4';

            // We handle the 2x2 spanning manually for the SVG
            for (let i = 0; i < 12; i++) {
                if (i === 0) {
                    finalGrid.appendChild(bodySvgCellWrapper);
                } else if (i === 1 || i === 4 || i === 5) {
                    // Skipped because index 0 spans across 0,1,4,5
                    continue;
                } else {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'w-full h-full';
                    cellDiv.innerHTML = cells[i] || '<div class="w-full h-full bg-slate-800/20 rounded-2xl"></div>';
                    finalGrid.appendChild(cellDiv);
                }
            }

            container.appendChild(finalGrid);
        }

        function renderSymptomGrid(container, bodyPart) {
            const symptoms = bodySymptomsData[bodyPart] || ["不舒服", "痛", "麻痺", "抽筋", "腫脹", "痕癢"];

            // 4x3 Grid math:
            // Available symptom slots: [0, 1, 2, 3, 4, 5, 6, 7, 9]
            // Index 8: THUMB REST ZONE (Mandatory)
            // Index 10: "‹ 返回人體圖" (Back to Body Diagram)
            // Index 11: Clear/Reset

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'w-full h-full grid grid-cols-4 grid-rows-3 gap-4';

            const cells = Array.from({ length: 12 }, () => null);

            // 1. Mandatory Thumb Rest Zone at index 8
            cells[8] = THUMB_REST_ZONE_HTML;

            // 2. Header / Back Button at index 10
            cells[10] = `
                <button onclick="backToBodyMap()" class="w-full h-full bg-amber-600 hover:bg-amber-500 text-white rounded-2xl text-2xl font-bold btn-press shadow-lg flex flex-col items-center justify-center border border-amber-400">
                    <span>‹ 返回人體圖</span>
                </button>
            `;

            // 3. Clear button at index 11
            cells[11] = `
                <button onclick="backToCategories()" class="w-full h-full bg-slate-800 text-slate-300 rounded-2xl text-xl font-bold btn-press shadow-md border border-slate-600">
                    🏠 返回主目錄
                </button>
            `;

            // 4. Fill Symptom buttons
            const availableSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
            symptoms.forEach((symptom, i) => {
                if (i < availableSlots.length) {
                    const targetSlot = availableSlots[i];
                    const fullPhrase = symptom.includes(bodyPart) ? symptom : `${bodyPart}${symptom}`;
                    cells[targetSlot] = `
                        <button onclick="handleWordClick('${fullPhrase}')" class="w-full h-full bg-rose-200 text-rose-950 rounded-2xl text-3xl font-extrabold shadow-md btn-press flex items-center justify-center p-2 text-center leading-tight">
                            ${symptom}
                        </button>
                    `;
                }
            });

            // Fill empty slots with placeholder
            cells.forEach((cellHtml, idx) => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'w-full h-full';
                cellDiv.innerHTML = cellHtml || '<div class="w-full h-full bg-slate-800/20 rounded-2xl"></div>';
                gridWrapper.appendChild(cellDiv);
            });

            // Sub-header banner above container
            const headerBanner = document.createElement('div');
            headerBanner.className = 'absolute top-0 left-0 right-0 bg-amber-600/30 border-b border-amber-500/40 py-1 px-4 text-amber-200 text-sm font-bold flex justify-between items-center z-10 pointer-events-none rounded-t-3xl';
            headerBanner.innerHTML = `<span>部位：【${bodyPart}】症狀選擇</span><span>請點擊對應症狀</span>`;

            container.appendChild(gridWrapper);
        }

        window.selectBodyPart = function(bodyPart) {
            currentBodyPart = bodyPart;
            renderMainView();
        };

        window.backToBodyMap = function() {
            currentBodyPart = null;
            renderMainView();
        };

        window.backToCategories = function() {
            currentCategory = '日常';
            currentBodyPart = null;
            renderCategories();
            renderMainView();
        };

        window.handleWordClick = function(word) {
            trackUsage(word);

            if (isImmediateMode) {
                // Immediate Speech Mode
                document.getElementById('sentence-display').innerText = word;
                speakText(word);
            } else {
                // Sentence Builder Mode
                currentSentence.push(word);
                updateSentenceDisplay();
            }

            // If in "最常用" category, re-render grid to dynamically update high-frequency rankings
            if (currentCategory === '最常用') {
                renderStandardGrid(document.getElementById('main-view-container'));
            }
        };

        window.changePage = function(direction) {
            currentPage += direction;
            renderMainView();
        };

        function bindGlobalEvents() {
            // Mode Toggle Switch
            const btnModeToggle = document.getElementById('btn-mode-toggle');
            const txtModeDesc = document.getElementById('mode-desc');

            btnModeToggle.addEventListener('click', () => {
                isImmediateMode = !isImmediateMode;
                if (isImmediateMode) {
                    btnModeToggle.innerHTML = '⚡ 即時發音模式';
                    btnModeToggle.className = 'bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2 rounded-xl text-lg font-bold btn-press shadow-md transition-colors';
                    txtModeDesc.innerText = '（點擊詞彙會立即朗讀發音）';
                    showToast('已切換至：即時發音模式 ⚡');
                } else {
                    btnModeToggle.innerHTML = '📝 句子組合模式';
                    btnModeToggle.className = 'bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-lg font-bold btn-press shadow-md transition-colors';
                    txtModeDesc.innerText = '（點擊按鈕累積句子，按 🔊 發音）';
                    showToast('已切換至：句子組合模式 📝');
                }
            });

            // Action: Play / Speak Sentence
            document.getElementById('btn-play').addEventListener('click', () => {
                if (currentSentence.length > 0) {
                    // Combine phrases with commas for natural pauses in Cantonese speech
                    speakText(currentSentence.join('，'));
                } else {
                    const text = document.getElementById('sentence-display').innerText;
                    if (text) {
                        speakText(text);
                    } else {
                        showToast('請先選擇字詞組合句子');
                    }
                }
            });

            // Action: Backspace
            document.getElementById('btn-backspace').addEventListener('click', () => {
                if (currentSentence.length > 0) {
                    currentSentence.pop();
                    updateSentenceDisplay();
                } else {
                    document.getElementById('sentence-display').innerText = '';
                }
            });

            // Action: Clear
            document.getElementById('btn-clear').addEventListener('click', () => {
                currentSentence = [];
                updateSentenceDisplay();
            });

            // Action: Import JSON Vocabulary File
            document.getElementById('file-import').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (typeof importedData === 'object' && importedData !== null && !Array.isArray(importedData)) {
                            vocabulary = importedData;
                            localStorage.setItem('aac_vocabulary', JSON.stringify(vocabulary));
                            showToast('詞庫匯入成功！');
                            currentCategory = '日常';
                            renderCategories();
                            renderMainView();
                        } else {
                            showToast('JSON 格式錯誤，根節點必須是物件。');
                        }
                    } catch (err) {
                        showToast('讀取 JSON 檔案失敗，請檢查檔案格式。');
                        console.error("JSON Import error:", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // Reset file input
            });
        }

        window.onload = init;
    </script>
</body>
</html>
