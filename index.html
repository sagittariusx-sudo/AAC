<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AAC 漸凍症輔助溝通系統 - iPad 雙手/軌跡板優化版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #080d1a; /* Dark navy background */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        /* Active button feedback scale */
        .btn-press:active {
            transform: scale(0.96);
            transition: transform 0.08s ease-out;
        }

        /* Interactive body part SVG hover / active highlight */
        .body-part-path {
            fill: #3b82f6;
            fill-opacity: 0.3;
            stroke: #60a5fa;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .body-part-path:hover, .body-part-path:active {
            fill: #f59e0b;
            fill-opacity: 0.65;
            stroke: #fbbf24;
            stroke-width: 3;
        }

        /* Custom 4-row strict grid layout */
        .grid-rows-4-strict {
            grid-template-rows: repeat(4, minmax(0, 1fr));
        }

        /* Notification Toast transition */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none overflow-hidden p-3 gap-3">

    <!-- Consolidated Top Toolbar -->
    <header class="h-20 bg-slate-900/90 rounded-2xl border border-slate-800 flex items-center px-4 gap-3 shrink-0 shadow-lg">
        <!-- Mode Switcher Button -->
        <button id="btn-mode-toggle" class="h-14 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl text-lg font-bold btn-press shadow-md transition-colors flex items-center gap-2 shrink-0">
            <span>📝 句子組合模式</span>
        </button>

        <!-- Shortened Sentence Display Box -->
        <div id="sentence-display" class="flex-1 h-14 bg-slate-100 text-slate-950 rounded-2xl px-5 text-2xl font-bold flex items-center overflow-x-auto whitespace-nowrap shadow-inner border-2 border-slate-300">
            <!-- Dynamically chosen words buffer -->
        </div>
        
        <!-- Action Buttons -->
        <button id="btn-backspace" title="退格" class="h-14 w-16 bg-amber-500 hover:bg-amber-400 text-white rounded-2xl text-2xl flex justify-center items-center btn-press shadow-lg shadow-amber-950/40 shrink-0">
            ⌫
        </button>
        <button id="btn-clear" title="清空" class="h-14 w-16 bg-rose-600 hover:bg-rose-500 text-white rounded-2xl text-2xl flex justify-center items-center btn-press shadow-lg shadow-rose-950/40 shrink-0">
            🗑️
        </button>
        <button id="btn-play" title="發音朗讀" class="h-14 w-32 bg-emerald-500 hover:bg-emerald-400 text-white rounded-2xl text-2xl flex justify-center items-center btn-press shadow-lg shadow-emerald-950/40 gap-2 font-bold shrink-0">
            🔊 <span>讀出</span>
        </button>
    </header>

    <!-- Main Interactive Workspace -->
    <main class="flex-1 flex overflow-hidden gap-3">
        
        <!-- Left Sidebar: Category Navigation with Top Pagination & Enlarged Thumb Rest Zone -->
        <aside class="w-1/4 max-w-[240px] flex flex-col justify-between h-full bg-slate-900/80 rounded-3xl p-3 border border-slate-800 shrink-0">
            
            <!-- Category Navigation -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- Sidebar Category Pagination Buttons -->
                <div id="category-nav" class="grid grid-cols-2 gap-2 mb-3 shrink-0">
                    <button id="btn-cat-prev" onclick="changeCategoryPage(-1)" class="h-12 bg-slate-800 text-slate-200 hover:bg-slate-700 rounded-2xl text-base font-bold btn-press border border-slate-700 disabled:opacity-30 disabled:pointer-events-none flex justify-center items-center shadow">
                        ▲ 上頁
                    </button>
                    <button id="btn-cat-next" onclick="changeCategoryPage(1)" class="h-12 bg-slate-800 text-slate-200 hover:bg-slate-700 rounded-2xl text-base font-bold btn-press border border-slate-700 disabled:opacity-30 disabled:pointer-events-none flex justify-center items-center shadow">
                        ▼ 下頁
                    </button>
                </div>

                <!-- Category List Container -->
                <div id="category-container" class="flex-1 flex flex-col gap-2 justify-start overflow-hidden">
                    <!-- Categories dynamically generated here -->
                </div>
            </div>

            <!-- MANDATORY LEFT THUMB REST ZONE (Enlarged Height) -->
            <div class="mt-3 shrink-0 h-40 border-2 border-dashed border-amber-500/60 bg-amber-950/40 rounded-2xl flex flex-col items-center justify-center text-amber-300 select-none pointer-events-none p-3 text-center shadow-inner">
                <span class="text-3xl mb-1">🖐️</span>
                <span class="text-base font-extrabold leading-snug">左手大拇指<br>休息區</span>
            </div>
        </aside>

        <!-- Right Main Grid Display: 3 Columns x 4 Rows Layout -->
        <section id="main-view-container" class="flex-1 relative bg-slate-900/60 rounded-3xl p-3 border border-slate-800 overflow-hidden h-full flex flex-col justify-between">
            <!-- Grid content rendered dynamically -->
        </section>

    </main>

    <!-- UI Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-2xl text-lg font-bold shadow-2xl opacity-0 pointer-events-none z-50 transform translate-y-4">
        <span id="toast-msg">通知</span>
    </div>

    <script>
        // Vocabulary Database
        const defaultVocabulary = {
            "最常用": [],
            "身體": [],
            "感受": ["開心", "傷心", "嬲", "驚", "好悶", "舒服", "辛苦", "擔心", "緊張", "放鬆"],
            "日常": ["你好", "謝謝", "對不起", "早晨", "早唞", "好", "唔好", "唔該", "不知道", "等等", "請幫忙", "係"],
            "飲食": ["想飲水", "想飲藥", "想食飯", "太熱", "太凍", "想食粥", "想喝湯", "太甜", "太鹹", "飽啦", "未飽", "擦嘴", "拿杯", "牙籤"],
            "護理": ["去厠所", "刷牙", "棉花棒", "眼淚", "鼻水"],
            "數字": ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "十", "百"],
            "環境": ["開燈", "關燈", "開電視", "關電視", "開冷氣", "關冷氣", "太嘈", "太靜", "開窗", "關窗"],
            "人物": ["老公", "Dewi", "文翔", "文彥", "文彬", "文青", "Tammy", "高翔", "嘉曼", "嘉裕", "婷婷", "司農", "司直", "司南", "司辰", "心心", "仔女", "醫生", "護士", "家人", "朋友"]
        };

        // Body Symptoms Database
        const bodySymptomsData = {
            "頭部": ["頭痛", "頭暈", "痕癢", "麻痺", "發熱", "壓迫感", "抽筋", "痛", "神智不清"],
            "頸部": ["頸痛", "喉嚨痛", "吞嚥困難", "轉動困難", "僵硬", "抽筋", "痕癢", "痰多", "喘氣"],
            "胸部": ["胸悶", "心口痛", "呼吸困難", "心跳快", "咳嗽", "壓迫感", "痛", "喘氣"],
            "腹部": ["肚痛", "肚脹", "胃痛", "想嘔", "肚瀉", "抽筋", "便秘", "消化不良"],
            "手部": ["手痛", "手軟", "手麻痺", "手抽筋", "手震", "無力", "關節痛", "腫脹"],
            "背部": ["背痛", "腰背痛", "背部僵硬", "酸痛", "壓迫感", "痕癢", "冷感", "抽筋"],
            "腰部": ["腰痛", "腰酸", "扭傷感", "僵硬", "無力", "麻痺", "抽筋", "刺痛"],
            "腳部": ["腳痛", "腳軟", "腳腫", "腳麻痺", "腳抽筋", "無力", "關節痛", "冷冰冰"]
        };

        // Button Color Themes
        const pastelColors = [
            'bg-sky-200 text-sky-950 hover:bg-sky-100',
            'bg-emerald-200 text-emerald-950 hover:bg-emerald-100',
            'bg-amber-200 text-amber-950 hover:bg-amber-100',
            'bg-purple-200 text-purple-950 hover:bg-purple-100',
            'bg-rose-200 text-rose-950 hover:bg-rose-100',
            'bg-teal-200 text-teal-950 hover:bg-teal-100',
            'bg-indigo-200 text-indigo-950 hover:bg-indigo-100',
            'bg-fuchsia-200 text-fuchsia-950 hover:bg-fuchsia-100'
        ];

        let vocabulary = defaultVocabulary;
        let usageStats = {};
        let currentCategory = '最常用';
        let currentBodyPart = null;
        
        // Category Pagination (Sidebar)
        let currentCategoryPage = 0;
        const categoriesPerPage = 4;

        // Word Grid Pagination (Now 10 words per page!)
        let currentWordPage = 0;
        const wordsPerPage = 10; 

        let isImmediateMode = false;
        let currentSentence = [];

        function init() {
            const savedStats = localStorage.getItem('aac_usageStats');
            usageStats = savedStats ? JSON.parse(savedStats) : {};

            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            bindGlobalEvents();
            renderCategories();
            renderMainView();
        }

        function saveStats() {
            localStorage.setItem('aac_usageStats', JSON.stringify(usageStats));
        }

        function trackUsage(word) {
            if (!word) return;
            usageStats[word] = (usageStats[word] || 0) + 1;
            saveStats();
        }

        function getFrequentWords() {
            return Object.entries(usageStats)
                .sort((a, b) => b[1] - a[1])
                .map(item => item[0]);
        }

        function speakText(text) {
            if (!text || text.trim() === '') return;

            if (!('speechSynthesis' in window)) {
                showToast('您的裝置不支援語音朗讀功能');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.88;

            const voices = window.speechSynthesis.getVoices();
            const hkVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.lang.includes('zh-MYS'));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            msg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        function updateSentenceDisplay() {
            const elDisplay = document.getElementById('sentence-display');
            elDisplay.innerText = currentSentence.join(' ');
            elDisplay.scrollLeft = elDisplay.scrollWidth;
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            const allCategories = ['最常用', '身體', '感受', '日常', '飲食', '護理', '數字', '環境', '人物'];
            const totalPages = Math.ceil(allCategories.length / categoriesPerPage);
            
            const startIndex = currentCategoryPage * categoriesPerPage;
            const pageCategories = allCategories.slice(startIndex, startIndex + categoriesPerPage);

            pageCategories.forEach(cat => {
                const isSelected = cat === currentCategory;
                const btn = document.createElement('button');
                
                let bgStyle = isSelected 
                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50 scale-[1.02]' 
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700';
                
                if (cat === '身體') {
                    bgStyle = isSelected 
                        ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/50 scale-[1.02]' 
                        : 'bg-amber-950/60 text-amber-200 border border-amber-600/40 hover:bg-amber-900/80';
                }

                btn.className = `w-full text-left px-4 py-3.5 rounded-2xl text-xl font-bold btn-press transition-all flex items-center justify-between shrink-0 ${bgStyle}`;
                
                let icon = '📁';
                if (cat === '最常用') icon = '⭐';
                if (cat === '身體') icon = '🧍';
                if (cat === '感受') icon = '❤️';
                if (cat === '日常') icon = '💬';
                if (cat === '飲食') icon = '🍚';
                if (cat === '護理') icon = '🧼';
                if (cat === '數字') icon = '🔢';
                if (cat === '環境') icon = '🏠';
                if (cat === '人物') icon = '👥';

                btn.innerHTML = `<span>${icon} ${cat}</span>`;
                btn.onclick = () => {
                    currentCategory = cat;
                    currentBodyPart = null;
                    currentWordPage = 0;
                    renderCategories();
                    renderMainView();
                };
                container.appendChild(btn);
            });

            document.getElementById('btn-cat-prev').disabled = (currentCategoryPage === 0);
            document.getElementById('btn-cat-next').disabled = (currentCategoryPage >= totalPages - 1);
        }

        window.changeCategoryPage = function(dir) {
            currentCategoryPage += dir;
            renderCategories();
        };

        function renderMainView() {
            const container = document.getElementById('main-view-container');
            container.innerHTML = '';

            if (currentCategory === '身體') {
                if (currentBodyPart) {
                    renderSymptomGrid(container, currentBodyPart);
                } else {
                    renderBodyMap(container);
                }
            } else {
                renderStandardGrid(container);
            }
        }

        function renderStandardGrid(container) {
            const words = currentCategory === '最常用' 
                ? getFrequentWords() 
                : (vocabulary[currentCategory] || []);

            // 3 Columns x 4 Rows Architecture:
            // - Words 1..9 in Rows 1..3 (Slots 0..8)
            // - Row 4 Col 1 (Slot 9): Left Thumb Rest Zone
            // - Row 4 Col 2 (Slot 10): Word 10
            // - Row 4 Col 3 (Slot 11): Combined Pagination Cell (◀ 上一頁 + 下一頁 ▶)
            const maxWordsPerPage = 10;
            const totalPages = Math.max(1, Math.ceil(words.length / maxWordsPerPage));
            const startIndex = currentWordPage * maxWordsPerPage;
            const currentWords = words.slice(startIndex, startIndex + maxWordsPerPage);

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'w-full h-full grid grid-cols-3 grid-rows-4-strict gap-3';

            // Populate Slots 0..8 (Rows 1..3)
            for (let i = 0; i < 9; i++) {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'w-full h-full';

                if (i < currentWords.length) {
                    const word = currentWords[i];
                    const colorClass = pastelColors[(startIndex + i) % pastelColors.length];
                    cellDiv.innerHTML = `
                        <button onclick="handleWordClick('${word}')" class="w-full h-full ${colorClass} rounded-2xl text-3xl font-extrabold shadow-md btn-press flex items-center justify-center p-2 text-center leading-snug break-words">
                            ${word}
                        </button>
                    `;
                } else {
                    cellDiv.innerHTML = `<div class="w-full h-full bg-slate-800/20 rounded-2xl border border-slate-800/40"></div>`;
                }
                gridWrapper.appendChild(cellDiv);
            }

            // Row 4 Col 1 (Slot 9): Main Grid Left Thumb Rest Zone
            const mainThumbRestCell = document.createElement('div');
            mainThumbRestCell.className = 'w-full h-full border-2 border-dashed border-amber-500/50 bg-amber-950/30 rounded-2xl flex flex-col items-center justify-center text-amber-300 select-none pointer-events-none p-2 text-center shadow-inner';
            mainThumbRestCell.innerHTML = `
                <span class="text-2xl mb-1">🖐️</span>
                <span class="text-sm font-extrabold leading-tight">左手大拇指<br>休息區</span>
            `;
            gridWrapper.appendChild(mainThumbRestCell);

            // Row 4 Col 2 (Slot 10): Word #10 Slot
            const word10Cell = document.createElement('div');
            word10Cell.className = 'w-full h-full';
            if (currentWords.length >= 10) {
                const word10 = currentWords[9];
                const colorClass = pastelColors[(startIndex + 9) % pastelColors.length];
                word10Cell.innerHTML = `
                    <button onclick="handleWordClick('${word10}')" class="w-full h-full ${colorClass} rounded-2xl text-3xl font-extrabold shadow-md btn-press flex items-center justify-center p-2 text-center leading-snug break-words">
                        ${word10}
                    </button>
                `;
            } else {
                word10Cell.innerHTML = `<div class="w-full h-full bg-slate-800/20 rounded-2xl border border-slate-800/40"></div>`;
            }
            gridWrapper.appendChild(word10Cell);

            // Row 4 Col 3 (Slot 11): Combined Pagination Box containing both Previous & Next buttons
            const combinedPaginationCell = document.createElement('div');
            combinedPaginationCell.className = 'w-full h-full grid grid-cols-2 gap-2 bg-slate-900/80 p-1 rounded-2xl border border-slate-800 shadow-inner';
            combinedPaginationCell.innerHTML = `
                <button onclick="changeWordPage(-1)" class="w-full h-full bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-lg font-bold btn-press shadow flex items-center justify-center border border-slate-700 disabled:opacity-30 disabled:pointer-events-none" ${currentWordPage === 0 ? 'disabled' : ''}>
                    ◀ 上頁
                </button>
                <button onclick="changeWordPage(1)" class="w-full h-full bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-lg font-bold btn-press shadow flex items-center justify-center border border-slate-700 disabled:opacity-30 disabled:pointer-events-none" ${currentWordPage >= totalPages - 1 ? 'disabled' : ''}>
                    下頁 ▶
                </button>
            `;
            gridWrapper.appendChild(combinedPaginationCell);

            container.appendChild(gridWrapper);
        }

        function renderBodyMap(container) {
            const mapWrapper = document.createElement('div');
            mapWrapper.className = 'w-full h-full grid grid-cols-3 grid-rows-4-strict gap-3';

            const bodyPartsList = [
                { name: '頭部', icon: '🗣️' },
                { name: '頸部', icon: '🧣' },
                { name: '胸部', icon: '🫁' },
                { name: '腹部', icon: '🤰' },
                { name: '手部', icon: '✋' },
                { name: '背部', icon: '🦴' },
                { name: '腰部', icon: '🩲' },
                { name: '腳部', icon: '🦶' }
            ];

            const bodySvgHTML = `
                <div class="col-span-2 row-span-4 w-full h-full bg-slate-950/80 rounded-2xl border border-slate-800 p-2 flex flex-col justify-between items-center relative overflow-hidden">
                    <div class="text-amber-300 text-base font-bold flex items-center gap-2">
                        <span>🧍 點擊圖中身體部位或右側按鈕</span>
                    </div>
                    
                    <div class="flex-1 w-full flex justify-around items-center gap-2 my-1">
                        <!-- Front View SVG -->
                        <div class="h-full flex flex-col items-center">
                            <span class="text-xs text-slate-400 font-bold mb-1">【 正面 】</span>
                            <svg viewBox="0 0 100 200" class="h-full max-h-[220px] w-auto">
                                <circle cx="50" cy="25" r="18" class="body-part-path" onclick="selectBodyPart('頭部')"/>
                                <text x="50" y="27" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold" pointer-events="none">頭</text>
                                
                                <rect x="42" y="44" width="16" height="12" rx="3" class="body-part-path" onclick="selectBodyPart('頸部')"/>
                                
                                <rect x="30" y="58" width="40" height="30" rx="5" class="body-part-path" onclick="selectBodyPart('胸部')"/>
                                <text x="50" y="76" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">胸</text>

                                <rect x="32" y="90" width="36" height="30" rx="5" class="body-part-path" onclick="selectBodyPart('腹部')"/>
                                <text x="50" y="108" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腹</text>

                                <path d="M 12 60 Q 25 58 28 62 L 25 120 Q 15 120 12 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <path d="M 88 60 Q 75 58 72 62 L 75 120 Q 85 120 88 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <text x="18" y="90" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold" pointer-events="none">手</text>

                                <path d="M 33 122 L 47 122 L 45 190 L 30 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <path d="M 53 122 L 67 122 L 70 190 L 55 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <text x="50" y="160" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腳</text>
                            </svg>
                        </div>

                        <!-- Back View SVG -->
                        <div class="h-full flex flex-col items-center">
                            <span class="text-xs text-slate-400 font-bold mb-1">【 背面 】</span>
                            <svg viewBox="0 0 100 200" class="h-full max-h-[220px] w-auto">
                                <circle cx="50" cy="25" r="18" class="body-part-path" onclick="selectBodyPart('頭部')"/>
                                
                                <rect x="42" y="44" width="16" height="12" rx="3" class="body-part-path" onclick="selectBodyPart('頸部')"/>

                                <rect x="30" y="58" width="40" height="35" rx="5" class="body-part-path" onclick="selectBodyPart('背部')"/>
                                <text x="50" y="78" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">背</text>

                                <rect x="32" y="95" width="36" height="25" rx="5" class="body-part-path" onclick="selectBodyPart('腰部')"/>
                                <text x="50" y="112" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" pointer-events="none">腰</text>

                                <path d="M 12 60 Q 25 58 28 62 L 25 120 Q 15 120 12 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>
                                <path d="M 88 60 Q 75 58 72 62 L 75 120 Q 85 120 88 115 Z" class="body-part-path" onclick="selectBodyPart('手部')"/>

                                <path d="M 33 122 L 47 122 L 45 190 L 30 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                                <path d="M 53 122 L 67 122 L 70 190 L 55 190 Z" class="body-part-path" onclick="selectBodyPart('腳部')"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;

            mapWrapper.innerHTML = bodySvgHTML;

            const rightColumnBtns = document.createElement('div');
            rightColumnBtns.className = 'col-span-1 row-span-4 grid grid-rows-4 gap-2 h-full';

            for (let r = 0; r < 4; r++) {
                const rowCell = document.createElement('div');
                rowCell.className = 'grid grid-cols-2 gap-2 h-full';

                const p1 = bodyPartsList[r * 2];
                const p2 = bodyPartsList[r * 2 + 1];

                rowCell.innerHTML = `
                    <button onclick="selectBodyPart('${p1.name}')" class="w-full h-full bg-gradient-to-br from-amber-200 to-amber-300 text-amber-950 rounded-2xl font-extrabold shadow-md btn-press flex flex-col items-center justify-center p-1 border border-amber-400">
                        <span class="text-xl">${p1.icon}</span>
                        <span class="text-sm">${p1.name}</span>
                    </button>
                    <button onclick="selectBodyPart('${p2.name}')" class="w-full h-full bg-gradient-to-br from-amber-200 to-amber-300 text-amber-950 rounded-2xl font-extrabold shadow-md btn-press flex flex-col items-center justify-center p-1 border border-amber-400">
                        <span class="text-xl">${p2.icon}</span>
                        <span class="text-sm">${p2.name}</span>
                    </button>
                `;
                rightColumnBtns.appendChild(rowCell);
            }

            mapWrapper.appendChild(rightColumnBtns);
            container.appendChild(mapWrapper);
        }

        function renderSymptomGrid(container, bodyPart) {
            const symptoms = bodySymptomsData[bodyPart] || ["不舒服", "痛", "麻痺", "抽筋", "腫脹", "痕癢"];

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'w-full h-full grid grid-cols-3 grid-rows-4-strict gap-3';

            for (let i = 0; i < 9; i++) {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'w-full h-full';

                if (i < symptoms.length) {
                    const symptom = symptoms[i];
                    const fullPhrase = symptom.includes(bodyPart) ? symptom : `${bodyPart}${symptom}`;
                    cellDiv.innerHTML = `
                        <button onclick="handleWordClick('${fullPhrase}')" class="w-full h-full bg-rose-200 text-rose-950 hover:bg-rose-100 rounded-2xl text-2xl font-extrabold shadow-md btn-press flex items-center justify-center p-2 text-center leading-tight">
                            ${symptom}
                        </button>
                    `;
                } else {
                    cellDiv.innerHTML = `<div class="w-full h-full bg-slate-800/20 rounded-2xl border border-slate-800/40"></div>`;
                }
                gridWrapper.appendChild(cellDiv);
            }

            // Row 4 Col 1: Thumb Rest Zone
            const mainThumbRestCell = document.createElement('div');
            mainThumbRestCell.className = 'w-full h-full border-2 border-dashed border-amber-500/50 bg-amber-950/30 rounded-2xl flex flex-col items-center justify-center text-amber-300 select-none pointer-events-none p-2 text-center shadow-inner';
            mainThumbRestCell.innerHTML = `
                <span class="text-2xl mb-1">🖐️</span>
                <span class="text-sm font-extrabold leading-tight">左手大拇指<br>休息區</span>
            `;

            // Row 4 Col 2: Back to body map
            const backBtnCell = document.createElement('div');
            backBtnCell.className = 'w-full h-full';
            backBtnCell.innerHTML = `
                <button onclick="backToBodyMap()" class="w-full h-full bg-amber-600 hover:bg-amber-500 text-white rounded-2xl text-lg font-bold btn-press shadow flex items-center justify-center border border-amber-400">
                    ‹ 返回人體圖
                </button>
            `;

            // Row 4 Col 3: Back to home categories
            const homeBtnCell = document.createElement('div');
            homeBtnCell.className = 'w-full h-full';
            homeBtnCell.innerHTML = `
                <button onclick="backToCategories()" class="w-full h-full bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl text-lg font-bold btn-press shadow border border-slate-700 flex items-center justify-center">
                    🏠 返回主目錄
                </button>
            `;

            gridWrapper.appendChild(mainThumbRestCell);
            gridWrapper.appendChild(backBtnCell);
            gridWrapper.appendChild(homeBtnCell);

            container.appendChild(gridWrapper);
        }

        window.selectBodyPart = function(bodyPart) {
            currentBodyPart = bodyPart;
            renderMainView();
        };

        window.backToBodyMap = function() {
            currentBodyPart = null;
            renderMainView();
        };

        window.backToCategories = function() {
            currentCategory = '感受';
            currentBodyPart = null;
            currentWordPage = 0;
            renderCategories();
            renderMainView();
        };

        window.handleWordClick = function(word) {
            trackUsage(word);

            if (isImmediateMode) {
                document.getElementById('sentence-display').innerText = word;
                speakText(word);
            } else {
                currentSentence.push(word);
                updateSentenceDisplay();
            }

            if (currentCategory === '最常用') {
                renderStandardGrid(document.getElementById('main-view-container'));
            }
        };

        window.changeWordPage = function(dir) {
            currentWordPage += dir;
            renderMainView();
        };

        function bindGlobalEvents() {
            const btnModeToggle = document.getElementById('btn-mode-toggle');

            btnModeToggle.addEventListener('click', () => {
                isImmediateMode = !isImmediateMode;
                if (isImmediateMode) {
                    btnModeToggle.innerHTML = '⚡ 即時發音模式';
                    btnModeToggle.className = 'h-14 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl text-lg font-bold btn-press shadow-md transition-colors flex items-center gap-2 shrink-0';
                    showToast('已切換至：即時發音模式 ⚡');
                } else {
                    btnModeToggle.innerHTML = '📝 句子組合模式';
                    btnModeToggle.className = 'h-14 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl text-lg font-bold btn-press shadow-md transition-colors flex items-center gap-2 shrink-0';
                    showToast('已切換至：句子組合模式 📝');
                }
            });

            document.getElementById('btn-play').addEventListener('click', () => {
                if (currentSentence.length > 0) {
                    speakText(currentSentence.join('，'));
                } else {
                    const text = document.getElementById('sentence-display').innerText;
                    if (text) {
                        speakText(text);
                    } else {
                        showToast('請先選擇字詞組合句子');
                    }
                }
            });

            document.getElementById('btn-backspace').addEventListener('click', () => {
                if (currentSentence.length > 0) {
                    currentSentence.pop();
                    updateSentenceDisplay();
                } else {
                    document.getElementById('sentence-display').innerText = '';
                }
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                currentSentence = [];
                updateSentenceDisplay();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
